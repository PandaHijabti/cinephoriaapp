<h1 class="mb-3">À l'affiche</h1>

<!-- Skeleton state -->
<div *ngIf="!films.length" class="row g-3">
  <div class="col-12 col-sm-6 col-lg-4">
    <div class="card-dark p-3">
      <div class="poster skeleton"></div>
      <div class="skeleton" style="height:18px; border-radius:6px; margin:12px 0 8px"></div>
      <div class="skeleton" style="height:14px; border-radius:6px; width:70%"></div>
    </div>
  </div>
</div>

<!-- Films grid -->
<div class="row g-3" *ngIf="films.length">
  <div *ngFor="let film of films" class="col-12 col-sm-6 col-lg-4">
    <a [routerLink]="['/film', film.id]" class="card-dark d-block p-3 h-100">
      <img class="poster mb-3 w-100 rounded" [src]="film.poster || 'assets/placeholder-poster.jpg'" [alt]="film.title" />
      <h5 class="mb-1" style="color:var(--text)">{{ film.title }}</h5>

      <div class="d-flex align-items-center gap-2 text-muted mb-2">
        <span>{{ film.year }}</span>
        <span>·</span>
        <app-star-rating [value]="film.rating"></app-star-rating>
      </div>

      <div class="d-flex gap-1 flex-wrap mb-2">
        <span *ngFor="let g of film.genres" class="badge badge-soft">{{ g }}</span>
      </div>

      <p class="mb-0" style="line-height:1.45; color:var(--muted)">
        {{ film.description }}
      </p>
    </a>
  </div>
</div>

<ng-container *ngIf="film; else loading">
  <div class="card-dark p-4">
    <div class="row g-4 align-items-start">
      <div class="col-12 col-md-4">
        <img class="poster" [src]="film.poster || 'assets/placeholder-poster.jpg'" [alt]="film.title" />
      </div>
      <div class="col-12 col-md-8">
        <h1 class="mb-2">{{ film.title }}</h1>
        <div class="d-flex align-items-center gap-2 text-muted mb-2">
          <span>{{ film.year }}</span>
          <span>·</span>
          <app-star-rating [value]="film.rating"></app-star-rating>
          <span>·</span>
          <span>{{ film.minAge }}+</span>
        </div>
        <div class="d-flex gap-1 flex-wrap mb-3">
          <span *ngFor="let g of film.genres" class="badge badge-soft">{{ g }}</span>
        </div>
        <p class="mb-4" style="color:var(--muted)">{{ film.description }}</p>

        <a routerLink="/reservation" class="btn btn-accent">Réserver une séance</a>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #loading><p class="text-muted">Chargement…</p></ng-template>

<div class="card card-dark p-4" style="max-width:420px;margin:0 auto">
  <h1 class="mb-3">{{ mode === 'login' ? 'Connexion' : 'Créer un compte' }}</h1>

  <div class="mb-3">
    <label class="form-label">Email</label>
    <input class="form-control" [(ngModel)]="email" type="email" autocomplete="username">
  </div>

  <div class="mb-3">
    <label class="form-label">Mot de passe</label>
    <input class="form-control" [(ngModel)]="password" type="password" autocomplete="current-password">
  </div>

  <div class="text-danger mb-2" *ngIf="error">{{ error }}</div>

  <div class="d-flex gap-2">
    <button class="btn btn-accent" (click)="submit()">
      {{ mode === 'login' ? 'Se connecter' : 'Créer le compte' }}
    </button>
    <button class="btn btn-outline-light" type="button"
            (click)="mode = (mode==='login' ? 'signup' : 'login')">
      {{ mode === 'login' ? 'Créer un compte' : 'J’ai déjà un compte' }}
    </button>
  </div>

  <hr class="my-3" style="border-color:var(--border)">
  <button class="btn btn-outline-light" type="button" (click)="logout()">Se déconnecter</button>
</div>

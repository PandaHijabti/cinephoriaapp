<h1 class="mb-3">Réservation</h1>

<div class="card card-dark p-3 mb-3">
  <div class="row g-3">
    <div class="col-sm-6 col-lg-4">
      <label class="form-label">Film</label>
      <select class="form-select" [(ngModel)]="form.filmId" (change)="onFilmChange()">
        <option [ngValue]="''" disabled>-- choisir --</option>
        <option *ngFor="let f of films" [ngValue]="f.id">{{ f.title }} ({{ f.year }})</option>
      </select>
    </div>
    <div class="d-flex align-items-center gap-3 mt-3" style="color:var(--muted)">
  <span><span style="display:inline-block;width:14px;height:14px;background:#0f1830;border:1px solid var(--border);border-radius:4px;margin-right:6px"></span>Libre</span>
  <span><span style="display:inline-block;width:14px;height:14px;background:#112347;border:1px solid var(--border);border-radius:4px;margin-right:6px"></span>Choisi</span>
  <span><span style="display:inline-block;width:14px;height:14px;background:#0f1830;border:1px solid var(--border);border-radius:4px;opacity:.45;margin-right:6px"></span>Occupé</span>
</div>


    <div class="col-sm-6 col-lg-4" *ngIf="dates.length">
      <label class="form-label">Date</label>
      <select class="form-select" [(ngModel)]="form.date" (change)="onDateChange()">
        <option [ngValue]="''" disabled>-- choisir --</option>
        <option *ngFor="let d of dates" [ngValue]="d">{{ d }}</option>
      </select>
    </div>

    <div class="col-lg-4" *ngIf="filtered.length">
      <label class="form-label">Séance</label>
      <select class="form-select" [(ngModel)]="form.showtimeId" (change)="onShowtimeChange()">
        <option [ngValue]="''" disabled>-- choisir --</option>
        <option *ngFor="let s of filtered" [ngValue]="s.id">
          {{ s.start | date:'shortTime' }} — {{ s.quality }} — {{ s.room.name }} — {{ s.price }}€
        </option>
      </select>
    </div>
  </div>
</div>

<div *ngIf="seats.length" class="card card-dark p-3">
  <h5 class="mb-3">Choix des sièges</h5>
  <div class="seat-grid">
    <button type="button"
            *ngFor="let s of seats"
            [disabled]="s.taken"
            [class.selected]="form.selectedSeats.includes(s.seat)"
            (click)="toggleSeat(s.seat)">
      {{ s.seat }}
    </button>
  </div>
</div>
